name: Update profile stats

on:
  repository_dispatch:
    types: [profile-metrics-updated]
  schedule:
    # Refresh every six hours, independently of the daily product-snapshot dispatch.
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh SVG stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REQUIRE_GITHUB_STATS: "1"
          PROFILE_METRICS_URL: https://kayahickin.com/api/profile-metrics
          PROFILE_SITE_MAX_AGE_HOURS: "48"
          REFRESH_TRIGGER: ${{ github.event_name }}
          WRITE_REFRESH_STATE: "1"
        run: python update_readme.py
      - name: Rebuild the cards
        # Redraws both panels from the language totals the refresh just wrote,
        # carrying the fresh stat values over
        # from dark_mode.svg. Stdlib only, so no install step is needed.
        run: python tools/build_svg.py
      - name: Verify refreshed cards and updater
        run: python -m unittest discover -s tests
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg loc_cache.json language_stats.json profile_refresh_state.json
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
